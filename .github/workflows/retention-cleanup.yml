name: Daily retention cleanup
on:
  push:
    paths:
      - .github/workflows/retention-cleanup.yml
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

jobs:
  run-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger daily cleanup
        run: |
          curl --fail --silent --show-error --location --max-time 30 \
            --header 'Cache-Control: no-cache' \
            'https://distincthardwoodflooring.com/?retention-check=1' \
            --output /dev/null
